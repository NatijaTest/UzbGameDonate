        + (us.map(([k, v]) => `

            <span>+${k}</span><span><b class="bal">${fmt(v.bal)}</b> ›</span>
        </div>`).join('') || `<p class="mu">${T('nu')}</p>`);

    /* --- yangi zakazlar --- */
    const ol = () => bs.map(o => `
        <div class="row" style="align-items:flex-start">
            <span>
                <b>№${o.id}</b> +${o.ph}<br>
                <span class="mu">${o.d}</span><br>
                ${o.it.map(x => nn(x.n) + (x.x ? ` <b class="pr">${x.k}: ${x.x}</b>` : '')).join('<br>')}<br>
                <b class="pr">${fmt(o.t)}</b>
            </span>
            <button class="p" onclick="fin('${o.ph}','${o.id}')">✅ ${T('fin')}</button>
        </div>`).join('') || `<p class="mu">${T('no')}</p>`;

    const body = AT == 'g' && AD == 1 ? gm() : AT == 'o' ? ol() : AT == 'k' ? kp() : ul();
    pg(`${tabs}<div class="pb">${body}</div>`);
}

function gm() {
    const c = AG && gc();

    /* --- o'yinlar ro'yxati + logotip --- */
    if (!c) {
        return `
        <div class="up">
            ${thumb('logo')}
            <div style="flex:1">
                <b>Logotip</b><br>
                ${fileBtn('logo')}
                ${padHtml('logo')}
            </div>
            ${IMG.logo ? `<button onclick="setImg('logo','')">✕</button>` : ''}
        </div>
        <input id="gn" placeholder="🎮 Yangi o'yin nomi (emoji bilan)">
        <button class="p" style="width:100%" onclick="addg()">➕ O'yin qo'shish</button>
        <div id="ae" class="er"></div>`
            + D.cats.map(x => `
        <div class="row" style="cursor:pointer" onclick="AG='${x.id}';apn()">
            <span>${x.t}</span><span class="mu">${x.i.length} ›</span>
        </div>`).join('');
    }

    /* --- bitta o'yinni tahrirlash --- */
    const modes = [["in", "⌨️ Input bilan"], ["no", "🚫 Inputsiz"], ["tg", "✈️ Telegram tugma"]];
    const modeBtns = modes.map(([k, l]) =>
        `<button class="${c.m == k ? 'on' : ''}" onclick="cm('${k}')">${l}</button>`).join('');
    const products = c.i.map((p, i) => `
        <div class="pr2">
            <div class="fr">
                <input value="${esc(p.n)}" onchange="pset(${i},'n',this.value)">
                <input value="${p.p}" inputmode="numeric" style="max-width:110px" onchange="pset(${i},'p',this.value)">
                <button onclick="pdel(${i})">🗑</button>
            </div>
            <div class="up">
                ${thumb(p.k)}
                <div style="flex:1">
                    ${fileBtn(i)}
                    ${padHtml(i)}
                </div>
                ${IMG[p.k] ? `<button onclick="setImg('${p.k}','')">✕</button>` : ''}
            </div>
        </div>`).join('');

    return `
        <button onclick="AG=null;apn()">← ${T('bk')}</button>
        <h3>${c.t}</h3>
        <input value="${esc(c.t)}" onchange="cset('t',this.value)">
        <p class="mu">Input rejimi:</p>
        <div class="tabs">${modeBtns}</div>`
        + (c.m == 'in' ? `<input value="${esc(c.l)}" placeholder="Input nomi (masalan: PUBG ID)" onchange="cset('l',this.value)">` : '')
        + (c.m == 'tg' ? `<p class="mu">«Sotib olish» bosilsa mijoz @Guest5214 ga o'tadi.</p>` : '') + `
        <div class="up">
            ${thumb(c.id)}
            <div style="flex:1">
                <b>O'yin rasmi</b> <span class="mu">(tovarda rasm bo'lmasa shu chiqadi)</span><br>
                ${fileBtn('c')}
                ${padHtml('c')}
            </div>
            ${IMG[c.id] ? `<button onclick="setImg('${c.id}','')">✕</button>` : ''}
        </div>
        <h4>Tovarlar</h4>
        ${products}
        <div class="fr" style="margin:10px 0">
            <input id="pn" placeholder="Tovar nomi">
            <input id="pp" placeholder="Narx" inputmode="numeric" style="max-width:110px">
            <button class="p" onclick="padd()">➕</button>
        </div>
        <div id="ae" class="er"></div>
        <button class="er" onclick="gdel()">🗑 O'yinni o'chirish</button>`;
}
/* Rasm yuklash: kichraytirilib (webp) bazaga saqlanadi */

function setImg(k, d) {
    IMG[k] = d;
    sv();
    icon();
    hd();
    apn();
    if (!DB) {
        return stat('💾 Rasm qurilmada saqlandi', 1);
    }
    DB.doc('cats/img_' + k).set({ d }).then(() => stat('✅ Rasm saqlandi', 1)).catch(e => stat('⚠️ Rasm yozilmadi: ' + ((e && e.code) || '') + ' ' + ((e && e.message) || e)));
}

/* ---------- Rasm: galereya / fayllar / joylash (paste) / tortib tashlash (drop) ---------- */
function fileBtn(k) {
    const key = JSON.stringify(k).replace(/"/g, "'");
    return `<label class="btn up-btn">🖼 Galereya<input type="file" accept="image/*" hidden onchange="upl(${key},this)"></label>`
        + `<label class="btn up-btn">📁 Fayllar<input type="file" hidden onchange="upl(${key},this)"></label>`;
}

function dropImg(e, k) {
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    imgFrom(f, k);
}

function padHtml(k) {
    const key = JSON.stringify(k);
    return `<div class="pad" contenteditable="true" data-ph="📋 Galereya ochilmasa: shu yerga bosib rasmni joylang (paste)" onpaste='pst(event,${key})' oninput='padIn(this,${key})' ondragover='event.preventDefault()' ondrop='dropImg(event,${key})'></div>`;
}

function pst(e, k) {
    const items = [...((e.clipboardData && e.clipboardData.items) || [])];
    const it = items.find(i => i.type.indexOf('image/') == 0);
    if (!it) return;
    e.preventDefault();
    imgFrom(it.getAsFile(), k);
}

function padIn(el, k) {
    const im = el.querySelector('img');
    if (!im) return;
    const src = im.src;
    el.innerHTML = '';
    imgSrc(src, k);
}

function upl(k, inp) {
    if (inp.files[0]) imgFrom(inp.files[0], k);
}

function imgFrom(f, k) {
    const r = new FileReader();
    r.onload = () => imgSrc(r.result, k);
    r.readAsDataURL(f);
}

function imgSrc(src, k) {
    const im = new Image();
    im.onerror = () => stat("⚠️ Rasm o'qilmadi");
    im.onload = () => {
        const M = k == 'logo' ? 256 : 128;
        const s = Math.min(1, M / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.width * s));
        cv.height = Math.max(1, Math.round(im.height * s));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        let key = k;
        if (typeof k == 'number') {
            const p = gc().i[k];
            key = p.k = p.k || 'p' + Date.now().toString(36);
            sc();
        } else if (k == 'c') {
            key = AG;
        }
        setImg(key, cv.toDataURL('image/webp', .8));
    };
    im.src = src;
}

function cset(k, v) {
    const c = gc();
    c[k] = v;
    sc(c);
}

function cm(m) {
    const c = gc();
    c.m = m;
    sc(c);
    apn();
}

function pset(i, k, v) {
    const c = gc();
    c.i[i][k] = k == 'p' ? parseInt(v.replace(/\D/g, '')) || 0 : v;
    sc(c);
}

function pdel(i) {
    const c = gc();
    c.i.splice(i, 1);
    sc(c);
    apn();
}

function padd() {
    const n = $('#pn').value.trim(), p = parseInt($('#pp').value.replace(/\D/g, ''));
    if (!n || !p) {
        return err("Tovar nomi va narxini (raqam) kiriting");
    }
    const c = gc();
    if (!c) {
        return err("O'yin topilmadi");
    }
    c.i.push({ n, p, k: 'p' + Date.now().toString(36) });
    sc(c);
    apn();
}

function addg() {
    const t = $('#gn').value.trim();
    if (!t) {
        return err("O'yin nomini kiriting");
    }
    const c = {
        id: 'g' + Date.now(), t, pf: '', i: [], m: 'no', l: '', o: Date.now()
    };
    D.cats.push(c);
    sc(c);
    AG = c.id;
    apn();
}

function gdel() {
    D.cats = D.cats.filter(c => c.id != AG);
    AG = null;
    sc();
    apn();
}

function fin(ph, id) {
    const o = (D.buys[ph] || []).find(x => x.id == id);
    if (o) {
        o.st = 'done';
        put('orders', o.id, o);
        apn();
    }
}

function top_() {
    const p = nm($('#tp').value), a = parseInt($('#ta').value.replace(/\s/g, ''));
    if (!p || !a) {
        return err(T('e6'));
    }
    (D.users[p] = D.users[p] || { pw: '', bal: 0 }).bal += a;
    put('users', p, D.users[p]);
    apn();
    hd();
}

function bl(s) {
    const a = parseInt($('#ta').value.replace(/\s/g, '')), u = D.users[AU];
    if (!a || a < 0) {
        return err(T('e7'));
    }
    if (s < 0 && u.bal < a) {
        return err(T('e8'));
    }
    u.bal += s * a;
    put('users', AU, u);
    apn();
    hd();
    err(T('s1'), 1);
}

function wd() {
    const u = D.users[AU];
    u.bal = 0;
    put('users', AU, u);
    apn();
    hd();
    err(T('s1'), 1);
}

async function pwd(c) {
    const v = $('#np').value;
    if (c && v.length < 4) {
        return err(T('e9'));
    }
    const u = D.users[AU];
    u.pw = c ? await H(AU + v) : '';
    put('users', AU, u);
    err(c ? T('s2') : T('s3'), 1);
}
document.title = NAME;
icon();
window.onerror = m => toast('⚠️ JS xato: ' + m);
ath();
R();
live();
</script>
</body></html>
